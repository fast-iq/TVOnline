name: Android Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  release:
    types: [ published ]

env:
  APP_NAME: "RussianTVPlayer"

jobs:
  # Job для проверки качества кода
  lint:
    runs-on: ubuntu-24.04
    name: Lint Check
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x TVApp/gradlew

      - name: Run Lint
        run: cd TVApp && ./gradlew lintDebug --no-daemon --stacktrace

      - name: Show Lint Report (on failure)
        if: failure()
        run: |
          echo "=== Lint XML report ==="
          cat TVApp/app/build/reports/lint-results-debug.txt 2>/dev/null || echo "(no txt report)"
          echo "=== Lint HTML report path ==="
          ls -la TVApp/app/build/reports/ 2>/dev/null || echo "(no reports dir)"

      - name: Upload Lint Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-report
          path: |
            TVApp/app/build/reports/lint-results-debug.html
            TVApp/app/build/reports/lint-results-debug.txt
          retention-days: 7

      - name: Clean Gradle Cache
        run: cd TVApp && ./gradlew clean --no-daemon

  # Job для сборки и тестирования
  build:
    runs-on: ubuntu-24.04
    name: Build & Test
    needs: lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x TVApp/gradlew

      - name: Decode Keystore (for release builds)
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        env:
          ENCODED_STRING: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ ! -z "$ENCODED_STRING" ]; then
            echo $ENCODED_STRING | base64 -d > TVApp/app/release-key.jks
          fi

      - name: Build Debug APK
        if: github.event_name == 'push'
        run: cd TVApp && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: cd TVApp && ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build Release Bundle (AAB)
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: cd TVApp && ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Run Tests (if any)
        run: cd TVApp && ./gradlew test --no-daemon
        continue-on-error: true

      - name: Get Version Info
        id: version
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Built version: $VERSION"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: TVApp/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release APK
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: TVApp/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Release Bundle
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: TVApp/app/build/outputs/bundle/release/*.aab
          retention-days: 30

  # Job для создания релиза на GitHub
  release:
    runs-on: ubuntu-24.04
    name: Create GitHub Release
    needs: build
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download Release APK
        uses: actions/download-artifact@v7
        with:
          name: release-apk
          path: ./artifacts/apk

      - name: Download Release Bundle
        uses: actions/download-artifact@v7
        with:
          name: release-bundle
          path: ./artifacts/bundle

      - name: Get Version Info
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ steps.version.outputs.version }}"
          body: |
            ## 📺 Russian TV Player - Version ${{ steps.version.outputs.version }}
            
            ### 🎯 Что нового:
            - Просмотр российских телеканалов в высоком качестве
            - Поддержка управления с пульта ДУ
            - Электронная программа передач (EPG)
            - Настройки часового пояса и языка интерфейса
            - Выбор качества потока (минимум, среднее, максимум, авто)
            - Запоминание последнего канала
            
            ### 📦 Файлы для установки:
            - `app-release.apk` - Для установки на Android TV приставки
            - `app-release.aab` - Для публикации в Google Play Store
            
            ### 🔧 Требования:
            - Android 9.0 (API 28) или выше
            - Устройство с поддержкой Android TV или пульт ДУ
            
            ### 📝 Установка:
            1. Скачайте файл `app-release.apk`
            2. Установите на ваше Android TV устройство
            3. Запустите приложение и наслаждайтесь просмотром!
            
            ---
            *Сборка выполнена автоматически через GitHub Actions*
          files: |
            ./artifacts/apk/*.apk
            ./artifacts/bundle/*.aab
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Android Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  release:
    types: [ published ]

permissions:
  contents: write

env:
  APP_NAME: "RussianTVPlayer"

jobs:
  # Job для проверки качества кода
  lint:
    runs-on: ubuntu-24.04
    name: Lint & Code Style
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x TVApp/gradlew

      - name: Run Android Lint
        run: cd TVApp && ./gradlew lintDebug --no-daemon --stacktrace

      - name: Run Ktlint (code style)
        run: cd TVApp && ./gradlew ktlintCheck --no-daemon

      - name: Show Lint Report (on failure)
        if: failure()
        run: |
          echo "=== Lint XML report ==="
          cat TVApp/app/build/reports/lint-results-debug.txt 2>/dev/null || echo "(no txt report)"
          echo "=== Lint HTML report path ==="
          ls -la TVApp/app/build/reports/ 2>/dev/null || echo "(no reports dir)"

      - name: Upload Lint Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-report
          path: |
            TVApp/app/build/reports/lint-results-debug.html
            TVApp/app/build/reports/lint-results-debug.txt
          retention-days: 7

      - name: Clean Gradle Cache
        run: cd TVApp && ./gradlew clean --no-daemon

  # Job проверки безопасности зависимостей: SBOM реального runtime classpath + скан osv.dev.
  # (Раньше был OWASP Action по голому checkout — он видел только gradle-wrapper.jar,
  # т.е. скан был фиктивным; gradle-плагин dependency-check Android-модули не поддерживает.)
  dependency-check:
    runs-on: ubuntu-24.04
    name: Security Scan (osv.dev)
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle (dependency cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x TVApp/gradlew

      - name: Generate SBOM (release runtime classpath)
        run: cd TVApp && ./gradlew :app:generateSbom --no-daemon

      - name: Install osv-scanner
        run: |
          curl -fsSL -o osv.tar.gz "https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64.tar.gz"
          tar xzf osv.tar.gz
          ./osv-scanner --version

      - name: Scan SBOM
        run: |
          ./osv-scanner scan source --sbom TVApp/app/build/sbom/bom.json -f json --output-file osv-report.json
          python3 - <<'PY'
          import json, collections
          d = json.load(open('osv-report.json'))
          rows = []
          scanned = 0
          for r in d.get('results', []):
              for p in r.get('packages', []):
                  scanned += 1
                  pkg = p['package']
                  for v in p.get('vulnerabilities', []):
                      sev = ((v.get('database_specific') or {}).get('severity') or 'Unknown').capitalize()
                      rows.append((sev, pkg['name'], pkg['version'], v['id']))
          counts = collections.Counter(s for s, *_ in rows)
          print('packages scanned: %d, advisories: %d %s' % (scanned, len(rows), dict(counts) or ''))
          with open('/tmp/sev.md', 'w') as f:
              if rows:
                  f.write('| Severity | Package | Advisory |\n|---|---|---|\n')
                  for s, n, ver, vid in sorted(rows):
                      f.write('| %s | %s@%s | %s |\n' % (s, n, ver, vid))
          PY
          echo "### Security scan (osv.dev)" >> $GITHUB_STEP_SUMMARY
          if [ -s /tmp/sev.md ]; then
            cat /tmp/sev.md >> $GITHUB_STEP_SUMMARY
          else
            echo "Уязвимостей не найдено." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Gate on High/Critical
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open('osv-report.json'))
          bad = []
          for r in d.get('results', []):
              for p in r.get('packages', []):
                  for v in p.get('vulnerabilities', []):
                      sev = ((v.get('database_specific') or {}).get('severity') or '').lower()
                      if sev in ('high', 'critical'):
                          bad.append((p['package']['name'], p['package']['version'], v['id'], sev))
          for b in bad:
              print('::error::%s@%s %s (%s)' % b)
          if bad:
              sys.exit(1)
          print('No High/Critical advisories — OK')
          PY

      - name: Upload Security Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-report
          path: |
            osv-report.json
            TVApp/app/build/sbom/bom.json
          retention-days: 14

  # Job для сборки и тестирования
  build:
    runs-on: ubuntu-24.04
    name: Build & Test
    needs: lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle (dependency cache)
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x TVApp/gradlew

      - name: Clear Gradle build cache
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        run: |
          rm -rf ~/.gradle/caches/build-cache-1
          echo "Build cache cleared"

      - name: Set versionCode/versionName from tag
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          MAJOR=$(echo "$TAG" | cut -d. -f1)
          MINOR=$(echo "$TAG" | cut -d. -f2)
          PATCH=$(echo "$TAG" | cut -d. -f3)
          [ -z "$PATCH" ] && PATCH=0
          VC=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          VN="${MAJOR}.${MINOR}.${PATCH}"
          echo "Setting versionCode=$VC versionName=$VN"
          sed -i "s/android:versionCode=\"[0-9]*\"/android:versionCode=\"$VC\"/" TVApp/app/src/main/AndroidManifest.xml
          sed -i "s/android:versionName=\"[^\"]*\"/android:versionName=\"$VN\"/" TVApp/app/src/main/AndroidManifest.xml
          grep "versionCode\|versionName" TVApp/app/src/main/AndroidManifest.xml

      - name: Decode Keystore (for release builds)
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        env:
          ENCODED_STRING: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ ! -z "$ENCODED_STRING" ]; then
            echo $ENCODED_STRING | base64 -d > TVApp/app/release-key.jks
          fi

      - name: Build Debug APK
        if: github.event_name == 'push'
        run: cd TVApp && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: cd TVApp && ./gradlew assembleRelease -PAPP_VERSION=${{ github.ref_name }} --no-daemon --no-build-cache --no-configuration-cache --stacktrace

      - name: Build Release Bundle (AAB)
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: cd TVApp && ./gradlew bundleRelease -PAPP_VERSION=${{ github.ref_name }} --no-daemon --no-build-cache --no-configuration-cache --stacktrace

      - name: Cache Robolectric jars
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: robolectric-${{ runner.os }}-android-all-instrumented-14-robolectric-10818077-i7
          restore-keys: robolectric-${{ runner.os }}-

      - name: Prefetch Robolectric android-all jar
        run: |
          # Robolectric скачивает SDK-образ (~100MB) из Maven Central в ~/.m2 в момент запуска
          # тестов; на чистом раннере эта загрузка периодически отваливается и валит
          # testDebugUnitTest. Скачиваем jar заранее с повторными попытками.
          ROBO_VER="14-robolectric-10818077-i7"
          ROBO_DIR="$HOME/.m2/repository/org/robolectric/android-all-instrumented/$ROBO_VER"
          ROBO_JAR="$ROBO_DIR/android-all-instrumented-$ROBO_VER.jar"
          if [ ! -f "$ROBO_JAR" ]; then
            mkdir -p "$ROBO_DIR"
            MIRROR="https://maven-central.storage-download.googleapis.com/maven2/org/robolectric/android-all-instrumented/$ROBO_VER"
            MAIN="https://repo1.maven.org/maven2/org/robolectric/android-all-instrumented/$ROBO_VER"
            OK=0
            for BASE in "$MIRROR" "$MAIN" "$MIRROR" "$MAIN" "$MIRROR"; do
              if curl -fsSL --connect-timeout 15 --max-time 900 -o "$ROBO_JAR.part" "$BASE/android-all-instrumented-$ROBO_VER.jar"; then
                mv "$ROBO_JAR.part" "$ROBO_JAR"
                OK=1
                break
              fi
              rm -f "$ROBO_JAR.part"
              echo "Attempt to $BASE failed, retrying in 5s..."
              sleep 5
            done
            [ "$OK" = "1" ] || { echo "::error::Failed to prefetch Robolectric android-all jar after 5 attempts"; exit 1; }
            # pom/чек-суммы Robolectric тоже читает из локального репозитория (мелкие файлы, без ретраев)
            curl -fsSL --connect-timeout 15 -o "$ROBO_DIR/android-all-instrumented-$ROBO_VER.pom" "$MIRROR/android-all-instrumented-$ROBO_VER.pom" \
              || curl -fsSL --connect-timeout 15 -o "$ROBO_DIR/android-all-instrumented-$ROBO_VER.pom" "$MAIN/android-all-instrumented-$ROBO_VER.pom" || true
            curl -fsSL --connect-timeout 15 -o "$ROBO_DIR/android-all-instrumented-$ROBO_VER.jar.sha512" "$MIRROR/android-all-instrumented-$ROBO_VER.jar.sha512" \
              || curl -fsSL --connect-timeout 15 -o "$ROBO_DIR/android-all-instrumented-$ROBO_VER.jar.sha512" "$MAIN/android-all-instrumented-$ROBO_VER.jar.sha512" || true
          fi
          ls -la "$ROBO_JAR"

      - name: Run Unit Tests
        run: cd TVApp && ./gradlew testDebugUnitTest --no-daemon

      - name: Coverage threshold (data package)
        run: cd TVApp && ./gradlew jacocoDataPackageCoverage --no-daemon

      - name: Generate Coverage Report
        if: always()
        run: cd TVApp && ./gradlew jacocoTestReport --no-daemon || true

      - name: Coverage Summary
        if: always()
        run: |
          XML=TVApp/app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          if [ -f "$XML" ]; then
            # Инструкционные счётчики всего проекта — последний INSTRUCTION-counter в XML
            TOTAL=$(sed 's/<counter /\n<counter /g' "$XML" | grep 'type="INSTRUCTION"' | tail -1)
            MISSED=$(echo "$TOTAL" | sed -n 's/.*missed="\([0-9]*\)".*/\1/p')
            COVERED=$(echo "$TOTAL" | sed -n 's/.*covered="\([0-9]*\)".*/\1/p')
            PCT=$(awk -v m="$MISSED" -v c="$COVERED" 'BEGIN{ if (m+c>0) printf "%.0f", 100*c/(m+c); else print 0 }')
            echo "### Покрытие: ${PCT}% инструкций (порог 45% для пакета data)" >> $GITHUB_STEP_SUMMARY
          else
            echo "Отчёт покрытия не найден" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: TVApp/app/build/reports/jacoco/
          retention-days: 14

      - name: Publish Coverage Badge
        if: always()
        run: |
          # Публичный бейдж: badge.json коммитится в orphan-ветку coverage (её push не
          # запускает workflow — триггеры только main и теги).
          XML=TVApp/app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          [ -f "$XML" ] || exit 0
          TOTAL=$(sed 's/<counter /\n<counter /g' "$XML" | grep 'type="INSTRUCTION"' | tail -1)
          MISSED=$(echo "$TOTAL" | sed -n 's/.*missed="\([0-9]*\)".*/\1/p')
          COVERED=$(echo "$TOTAL" | sed -n 's/.*covered="\([0-9]*\)".*/\1/p')
          PCT=$(awk -v m="$MISSED" -v c="$COVERED" 'BEGIN{ if (m+c>0) printf "%.0f", 100*c/(m+c); else print 0 }')
          COLOR=$(awk -v p="$PCT" 'BEGIN{ if (p>=70) print "brightgreen"; else if (p>=50) print "yellow"; else print "red" }')
          mkdir -p /tmp/badge && cd /tmp/badge
          git init -q && git config user.name "coverage-bot" && git config user.email "ci@local"
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$PCT" "$COLOR" > badge.json
          git add badge.json && git commit -qm "coverage $PCT%"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/coverage

      - name: Show Failed Tests Summary
        if: failure()
        run: |
          # Краткий список упавших тестов прямо в лог — чтобы не скачивать артефакт ради диагностики
          for f in TVApp/app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$f" ] || continue
            if grep -q "<failure\|<error" "$f"; then
              echo "::group::$(basename "$f")"
              grep -o 'testcase name="[^"]*"' "$f" | head -50
              grep -o 'message="[^"]*"' "$f" | head -20
              echo "::endgroup::"
            fi
          done
          echo "Полные отчёты — в артефакте test-results"

      - name: Upload Test Results (on failure)
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: |
            TVApp/app/build/test-results/testDebugUnitTest/
            TVApp/app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

      - name: Verify APK Signature (release)
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          APK=$(find TVApp/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then echo "No release APK found"; exit 1; fi
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then echo "apksigner not found in SDK"; exit 1; fi
          echo "Verifying signature of: $APK (using $APKSIGNER)"
          "$APKSIGNER" verify --print-certs "$APK"
          echo "APK signature verified OK"

      - name: Verify AAB Signature (release)
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        run: |
          AAB=$(find TVApp/app/build/outputs/bundle/release -name "*.aab" | head -1)
          if [ -z "$AAB" ]; then echo "No release AAB found"; exit 1; fi
          echo "Verifying bundle of: $AAB"
          file "$AAB"
          unzip -t "$AAB" > /dev/null && echo "AAB archive integrity OK"

      - name: Get Version Info
        id: version
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Built version: $VERSION"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: TVApp/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release APK
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: TVApp/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Release Bundle
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: TVApp/app/build/outputs/bundle/release/*.aab
          retention-days: 30

  # Job для создания релиза на GitHub
  release:
    runs-on: ubuntu-24.04
    name: Create GitHub Release
    needs: build
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download Release APK
        uses: actions/download-artifact@v8
        with:
          name: release-apk
          path: ./artifacts/apk

      - name: Download Release Bundle
        uses: actions/download-artifact@v8
        with:
          name: release-bundle
          path: ./artifacts/bundle

      - name: Get Version Info
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ steps.version.outputs.version }}"
          body: |
            ## 📺 Russian TV Player - Version ${{ steps.version.outputs.version }}

            Полный список изменений — в авто-gen changelog ниже (Full Changelog).

            ### 📦 Файлы для установки:
            - `app-release.apk` - Для установки на Android TV приставки
            - `app-release.aab` - Для публикации в Google Play Store

            ### 🔧 Требования:
            - Android 9.0 (API 28) или выше
            - Устройство с поддержкой Android TV или пульт ДУ

            ### 📝 Установка:
            1. Скачайте файл `app-release.apk`
            2. Установите на ваше Android TV устройство (разрешите установку из неизвестных источников)
            3. Приложение также само проверит обновления при запуске

            ---
            *Сборка выполнена автоматически через GitHub Actions*
          files: |
            ./artifacts/apk/*.apk
            ./artifacts/bundle/*.aab
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

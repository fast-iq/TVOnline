plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def gitTags = null
try {
    def stdout = new ByteArrayOutputStream()
    rootProject.exec {
        commandLine 'git', 'describe', '--tags', '--abbrev=0'
        standardOutput = stdout
    }
    gitTags = stdout.toString().trim()
} catch (Exception ignored) {
}

def versionFromTag = null
if (gitTags != null && gitTags) {
    def m = (gitTags =~ /v?(\d+)\.(\d+)(?:\.(\d+))?/)
    if (m.find()) {
        def major = m.group(1).toInteger()
        def minor = m.group(2).toInteger()
        def patch = m.group(3) != null ? m.group(3).toInteger() : 0
        versionFromTag = "${major}.${minor}.${patch}"
    } else {
        versionFromTag = gitTags
    }
}

def parsedVersionName = versionFromTag ?: "1.0"
def parsedVersionCode = versionFromTag != null ?
    (versionFromTag.split('.').withIndex().sum { v, i -> v.toInteger() * (10000 ** (2 - i)) }) : 1

android {
    namespace 'com.example.tvapp'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.tvapp"
        minSdk 28
        targetSdk 35
        versionCode parsedVersionCode
        versionName parsedVersionName
    }

    signingConfigs {
        release {
            def ksFile = file("release-key.jks")
            if (ksFile.exists() && System.getenv("RELEASE_KEYSTORE_PASSWORD")) {
                storeFile ksFile
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def ksFile = file("release-key.jks")
            if (ksFile.exists() && System.getenv("RELEASE_KEYSTORE_PASSWORD")) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }

    lint {
        disable 'UnsafeOptInUsageError', 'OldTargetApi', 'DiscouragedApi', 'GradleDependency', 'VectorRaster', 'NotifyDataSetChanged'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.leanback:leanback:1.2.0-alpha04'

    // Media3 (новый ExoPlayer) для воспроизведения видео
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'

    // Для работы с JSON
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    // Preferences
    implementation 'androidx.preference:preference-ktx:1.2.1'

    // Glide для загрузки изображений
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}

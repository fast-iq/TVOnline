plugins {
    id 'com.android.application'
    id 'org.jlleitschuh.gradle.ktlint'
    id 'jacoco'
}

ktlint {
    android = true
    additionalEditorconfig = [
        "ktlint_standard_trailing-comma-on-call-site": "disabled",
        "ktlint_standard_trailing-comma-on-declaration-site": "disabled"
    ]
}

def appVersion = project.hasProperty('APP_VERSION') ? project.APP_VERSION : null
if (!appVersion) {
    def ciRef = System.getenv("GITHUB_REF_NAME")
    if (ciRef != null && ciRef) {
        appVersion = ciRef
    }
}

// ВАЖНО: имена не должны совпадать с property у defaultConfig — внутри closure
// правая часть резолвится owner-first и 'versionCode = versionCode' присваивал null.
def resolvedVersionName = "1.0.19"
def resolvedVersionCode = 10019
if (appVersion != null && appVersion) {
    def m = (appVersion =~ /v?(\d+)\.(\d+)(?:\.(\d+))?/)
    if (m.find()) {
        def major = m.group(1).toInteger()
        def minor = m.group(2).toInteger()
        def patch = m.group(3) != null ? m.group(3).toInteger() : 0
        resolvedVersionName = "${major}.${minor}.${patch}"
        resolvedVersionCode = (major * 10000) + (minor * 100) + patch
    } else {
        resolvedVersionName = appVersion
    }
}

android {
    namespace = 'com.example.tvapp'
    compileSdk 37

    defaultConfig {
        applicationId "com.example.tvapp"
        minSdk 28
        targetSdk 36
        versionCode = resolvedVersionCode
        versionName = resolvedVersionName
    }

    signingConfigs {
        release {
            def ksFile = file("release-key.jks")
            if (ksFile.exists() && System.getenv("RELEASE_KEYSTORE_PASSWORD")) {
                storeFile ksFile
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def ksFile = file("release-key.jks")
            if (ksFile.exists() && System.getenv("RELEASE_KEYSTORE_PASSWORD")) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding = true
    }

    lint {
        lintConfig = file("lint.xml")
        checkReleaseBuilds = true
        abortOnError = false
        xmlReport = true
        htmlReport = true
        textReport = true
    }

    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.leanback:leanback:1.2.0'

    // Media3 (новый ExoPlayer) для воспроизведения видео
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    // Preferences
    implementation 'androidx.preference:preference-ktx:1.2.1'

    // Glide для загрузки изображений
    implementation 'com.github.bumptech.glide:glide:5.0.10'

    // media3-common тянет guava 33.3.1-android с GHSA-xxph-c9ww-hj94 (High 8.2) —
    // пиним на исправленную ветку (совместима: Android-вариант той же мажорной линии).
    constraints {
        implementation 'com.google.guava:guava:33.7.2-android'
    }

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
    testImplementation 'org.robolectric:robolectric:4.15.1'
}

// --- Покрытие (JaCoCo) ---
// Юнит-тесты идут под Robolectric; агент JaCoCo цепляется к testDebugUnitTest автоматически.
tasks.withType(Test).configureEach {
    jacoco {
        includeNoLocationClasses = true
        excludes = ['jdk.internal.*']
    }
}

def coverageExcludes = [
    '**/R.class',
    '**/R$*.class',
    '**/BuildConfig.*',
    '**/databinding/**',
    '**/*_Injector*',
    '**/*_Factory*'
]

def coverageClasses = files(
    fileTree(dir: layout.buildDirectory.dir('intermediates/built_in_kotlinc/debug/compileDebugKotlin/classes').get().asFile, excludes: coverageExcludes),
    fileTree(dir: layout.buildDirectory.dir('intermediates/javac/debug/classes').get().asFile, excludes: coverageExcludes)
)
def coverageSources = files('src/main/java')
def coverageExec = files(layout.buildDirectory.file('jacoco/testDebugUnitTest.exec'))

tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'
    description 'HTML+XML отчёт покрытия юнит-тестами'
    group 'verification'
    reports {
        xml.required = true
        html.required = true
    }
    sourceDirectories.setFrom(coverageSources)
    classDirectories.setFrom(coverageClasses)
    executionData.setFrom(coverageExec)
}

tasks.register('jacocoDataPackageCoverage', JacocoCoverageVerification) {
    dependsOn 'testDebugUnitTest'
    description 'Порог покрытия пакета data (ядро: парсеры, кэши, репозитории)'
    group 'verification'
    sourceDirectories.setFrom(coverageSources)
    classDirectories.setFrom(coverageClasses)
    executionData.setFrom(coverageExec)
    violationRules {
        rule {
            element = 'PACKAGE'
            includes = ['com.example.tvapp.data']
            limit {
                counter = 'INSTRUCTION'
                minimum = 0.45
            }
        }
    }
}

tasks.register('generateSbom') {
    description 'CycloneDX SBOM runtime-зависимостей (основа CI-скана уязвимостей)'
    group 'verification'
    doLast {
        def latest = new TreeMap<String, String>()
        configurations.releaseRuntimeClasspath.incoming.resolutionResult.allComponents.each { c ->
            def mv = c.moduleVersion
            // версия unspecified — сам модуль приложения, не внешняя зависимость
            if (mv != null && mv.version != 'unspecified') latest["${mv.group}:${mv.name}"] = mv.version
        }
        def components = latest.collect { ga, v ->
            def parts = ga.split(':', 2)
            [
                'bom-ref': "${ga}@${v}".toString(),
                type     : 'library',
                group    : parts[0],
                name     : parts[1],
                version  : v,
                purl     : "pkg:maven/${parts[0]}/${parts[1]}@${v}".toString()
            ]
        }
        def bom = [
            bomFormat : 'CycloneDX',
            specVersion: '1.5',
            version   : 1,
            metadata  : [tools: [[vendor: 'TVOnline', name: 'generateSbom']]],
            components: components
        ]
        def out = layout.buildDirectory.file('sbom/bom.json').get().asFile
        out.parentFile.mkdirs()
        out.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(bom))
        println "SBOM: ${components.size()} components -> ${out}"
    }
}

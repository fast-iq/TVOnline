plugins {
    id 'com.android.application'
    id 'org.jlleitschuh.gradle.ktlint'
}

ktlint {
    android = true
    additionalEditorconfig = [
        "ktlint_standard_trailing-comma-on-call-site": "disabled",
        "ktlint_standard_trailing-comma-on-declaration-site": "disabled"
    ]
}

def appVersion = project.hasProperty('APP_VERSION') ? project.APP_VERSION : null
if (!appVersion) {
    def ciRef = System.getenv("GITHUB_REF_NAME")
    if (ciRef != null && ciRef) {
        appVersion = ciRef
    }
}

def versionName = "1.0.16"
def versionCode = 10016
if (appVersion != null && appVersion) {
    def m = (appVersion =~ /v?(\d+)\.(\d+)(?:\.(\d+))?/)
    if (m.find()) {
        def major = m.group(1).toInteger()
        def minor = m.group(2).toInteger()
        def patch = m.group(3) != null ? m.group(3).toInteger() : 0
        versionName = "${major}.${minor}.${patch}"
        versionCode = (major * 10000) + (minor * 100) + patch
    } else {
        versionName = appVersion
    }
}

android {
    namespace = 'com.example.tvapp'
    compileSdk 37

    defaultConfig {
        applicationId "com.example.tvapp"
        minSdk 28
        targetSdk 36
        versionCode = versionCode
        versionName = versionName
    }

    signingConfigs {
        release {
            def ksFile = file("release-key.jks")
            if (ksFile.exists() && System.getenv("RELEASE_KEYSTORE_PASSWORD")) {
                storeFile ksFile
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def ksFile = file("release-key.jks")
            if (ksFile.exists() && System.getenv("RELEASE_KEYSTORE_PASSWORD")) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding = true
    }

    lint {
        lintConfig = file("lint.xml")
        checkReleaseBuilds = true
        abortOnError = false
        xmlReport = true
        htmlReport = true
        textReport = true
    }

    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.leanback:leanback:1.2.0'

    // Media3 (новый ExoPlayer) для воспроизведения видео
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    // Preferences
    implementation 'androidx.preference:preference-ktx:1.2.1'

    // Glide для загрузки изображений
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
    testImplementation 'org.robolectric:robolectric:4.15.1'
}
